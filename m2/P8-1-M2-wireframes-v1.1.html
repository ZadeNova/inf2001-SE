<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P8-1 M2 Wireframes</title>
<!-- Draft clickable wireframe of m2/wireframes.md v1.1 (W-01 to W-16), updated for SRS v4.1 and DEC-96 to DEC-98. Self-contained: no external scripts, fonts or services (AGENTS.md rule 5). Sample names and numbers are placeholders. -->
<style>
:root{
  --paper:#f4f3ef; --sheet:#ffffff; --ink:#1c1c1e; --ink2:#3a3a3d; --muted:#6c6b68; --line:#cfccc4; --line2:#e4e1da;
  --box:#efede8; --fill:#dcd9d1; --fill2:#c4c0b6;
  --accent:#2c56c9; --accent-bg:#e7edfb;
  --warn:#9a5b00; --warn-bg:#fdf1d8; --warn-line:#e7c27a;
  --block:#a8261b; --block-bg:#fbe6e3;
  --ok:#2b6f47; --ok-bg:#e3f2e8;
  --me:#1c1c1e; --dc:#1c1c1e;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}

/* ---------- doc shell ---------- */
.doc{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:#fbfaf7;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:15px;margin:0 0 2px}
.side .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.side h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 6px 6px}
.side a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--ink2);text-decoration:none;font-size:13px}
.side a:hover{background:var(--box)}
.side a.on{background:var(--ink);color:#fff}
.side a .id{font-family:var(--mono);font-size:11px;opacity:.7;min-width:34px}
.side .mode{display:flex;gap:4px;margin-top:4px}
.side .mode button{flex:1;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:5px 4px;font-size:12px;cursor:pointer}
.side .mode button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.main{padding:24px 28px 80px;min-width:0}
.scr{margin:0 auto 56px;max-width:1500px}
.scr-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:10px}
.scr-head h2{margin:0;font-size:20px}
.scr-head .wid{font-family:var(--mono);font-size:13px;background:var(--ink);color:#fff;padding:2px 7px;border-radius:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.meta span{font-size:12px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.meta b{font-weight:600}
.notes{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px 24px;font-size:13px;color:var(--ink2)}
.notes div{display:flex;gap:8px}
.notes .n{flex:none}
.purpose{font-size:13.5px;color:var(--ink2);max-width:900px;margin:-4px 0 12px}

/* ---------- frames ---------- */
.scaler{position:relative;width:100%;overflow:hidden}
.desk{width:1366px;transform-origin:0 0;position:absolute;left:0;top:0;background:var(--sheet);border:1px solid var(--ink2);border-radius:8px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.chrome{height:34px;background:var(--box);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--fill2);display:inline-block}
.chrome .url{margin-left:14px;background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:2px 10px;font-size:12px;color:var(--muted);width:420px;font-family:var(--mono)}
.appbar{display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;margin-right:18px;display:flex;align-items:center;gap:8px}
.logo::before{content:"";width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;background:repeating-linear-gradient(45deg,transparent 0 4px,var(--fill) 4px 6px)}
.appbar .tab{padding:6px 11px;border-radius:6px;color:var(--ink2);font-size:13.5px}
.appbar .tab.on{background:var(--ink);color:#fff}
.appbar .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bell{position:relative;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.bell::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--fill)}
.page{padding:20px 24px 28px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ph h3{margin:0;font-size:20px}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.phone-row{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start}
.phone-cap{font-size:12px;color:var(--muted);margin:8px 0 0;max-width:360px}
.phone{width:360px;min-height:720px;background:var(--sheet);border:1px solid var(--ink2);border-radius:26px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.sbar{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.mtop{padding:8px 16px 12px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.mtop h4{margin:0;font-size:16px}
.mbody{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:12px}
.mnav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);height:58px}
.mnav span{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);gap:3px}
.mnav span::before{content:"";width:18px;height:18px;border:1.5px solid currentColor;border-radius:5px}
.mnav span.on{color:var(--ink);font-weight:600}
.mnav span.on::before{background:var(--ink)}

/* ---------- primitives ---------- */
.card{border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.card>.hd{padding:10px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;font-weight:600}
.card>.hd .r{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--muted)}
.card>.bd{padding:12px 14px}
.grid{display:grid;gap:16px}
.btn{border:1px solid var(--ink2);background:var(--sheet);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--box)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--block);color:var(--block)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.full{width:100%;padding:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--accent);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;background:var(--sheet);white-space:nowrap}
.chip.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.chip.block{background:var(--block-bg);border-color:#efb3ab;color:var(--block)}
.chip.ok{background:var(--ok-bg);border-color:#a9d3b8;color:var(--ok)}
.chip.acc{background:var(--accent-bg);border-color:#b8c8f2;color:var(--accent)}
.brand{display:inline-block;font-size:10.5px;font-weight:600;border:1.5px solid var(--ink);border-radius:3px;padding:0 4px;line-height:15px;letter-spacing:.02em}
.brand.dc{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.field>label{font-weight:600;font-size:12px}
.inp{border:1px solid var(--fill2);border-radius:6px;padding:7px 10px;background:var(--sheet);min-height:34px;font-size:13.5px;width:100%}
.inp.ro{background:var(--box);color:var(--ink2)}
.inp.ph{color:var(--muted)}
select.inp{appearance:auto}
.hint{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.sep{height:1px;background:var(--line2);margin:8px 0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.banner{border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:#5c3a00}
.banner.block{background:var(--block-bg);border:1px solid #efb3ab;color:#6e1a12}
.banner.ok{background:var(--ok-bg);border:1px solid #a9d3b8;color:#174a2c}
.banner.info{background:var(--accent-bg);border:1px solid #b8c8f2;color:#1b3a8a}
.banner.grey{background:var(--box);border:1px solid var(--line);color:var(--ink2)}
.ico{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid currentColor}
.seg{display:inline-flex;border:1px solid var(--fill2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:5px 10px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--fill2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.radio{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:13.5px}
.radio input{accent-color:var(--ink)}
.pin{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e8590c;color:#fff;font:700 10.5px/1 system-ui;font-style:normal;flex:none;vertical-align:middle}
.ann .pin{display:none}
body.pins .ann .pin{display:inline-grid}
body:not(.pins) .notes .pin{background:var(--fill2)}

/* ---------- modal / toast ---------- */
.scrim{position:absolute;inset:0;background:rgba(28,28,30,.38);display:none;align-items:center;justify-content:center;z-index:5}
.scrim.on{display:flex}
.modal{background:var(--sheet);border-radius:10px;border:1px solid var(--ink2);width:520px;max-width:92%;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line2);font-weight:700;font-size:16px}
.modal .bd{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-size:13px;z-index:6;display:none;max-width:80%}
.toast.on{display:block}
.toast.block{background:var(--block)}

/* ---------- W-03 ---------- */
.wl{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:6px 10px;font-size:12.5px}
.wl .bar{position:relative;height:16px;background:var(--box);border-radius:3px}
.wl .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fill2);border-radius:3px}
.wl .bar i.ot{background:repeating-linear-gradient(135deg,#e2a23b 0 5px,#f3c56f 5px 10px);outline:1.5px solid var(--warn)}
.wl .bar .forty{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--block)}
.wl .v{text-align:right;font-family:var(--mono);font-size:12px}
.wl .v.ot{color:var(--warn);font-weight:700}
.wl .grp{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px;align-items:flex-start}
.alert:last-child{border-bottom:0}
.alert .count{font-family:var(--mono);font-weight:700;font-size:18px;min-width:30px}
.alert.done{opacity:.45}
.mini-crew{border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.5px}

/* ---------- W-06 ---------- */
.alloc{display:grid;grid-template-columns:1fr 300px;gap:16px}
.days{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.days button{border:0;background:none;padding:9px 16px;cursor:pointer;border-bottom:3px solid transparent;font-size:13.5px;color:var(--ink2)}
.days button.on{border-bottom-color:var(--ink);font-weight:700;color:var(--ink)}
.days button small{display:block;font-size:11px;color:var(--muted)}
.crews{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.crew{border:1.5px solid var(--ink2);border-radius:8px;background:var(--sheet)}
.crew.over{outline:3px dashed var(--accent);outline-offset:2px}
.crew .ch{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.crew .ch b{font-size:15px}
.crew .ch select{border:1px solid var(--fill2);border-radius:5px;padding:2px 6px;font-size:12.5px}
.crew .mem{padding:6px 12px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line2)}
.person{display:flex;align-items:center;gap:8px;font-size:13px}
.person .role{font-size:10.5px;color:var(--muted);width:66px;text-transform:uppercase;letter-spacing:.04em}
.person .hrs{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.person .hrs.ot{color:var(--warn);font-weight:700}
.jobs{padding:8px 12px;display:flex;flex-direction:column;gap:5px;min-height:58px}
.job{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;background:var(--sheet)}
.job .t{font-family:var(--mono);font-size:12px;border:1px solid var(--fill2);border-radius:4px;padding:1px 4px;width:58px}
.job.warnj{border-color:var(--warn-line);background:var(--warn-bg)}
.drop{border:1.5px dashed var(--fill2);border-radius:6px;padding:7px;text-align:center;color:var(--muted);font-size:12px}
.uj{cursor:grab}
.uj:active{cursor:grabbing}
.uj .grip{width:8px;height:16px;background:radial-gradient(circle,var(--fill2) 1.2px,transparent 1.4px) 0 0/4px 4px}
.sb{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px}
.sb:last-child{border-bottom:0}
.src{font-size:10.5px;border:1px solid var(--fill2);border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--box);white-space:nowrap}
.src.pick{background:var(--accent-bg);border-color:#b8c8f2;color:var(--accent)}
.warnrow{border-bottom:1px solid var(--line2);padding:9px 0;font-size:12.5px}
.warnrow:last-child{border-bottom:0}
.warnrow .why{display:flex;gap:6px;margin-top:6px}
.warnrow.done{opacity:.6}
.status-chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ink2);font-weight:600}
.status-chip.pub{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

/* ---------- W-07 ---------- */
.cmp{display:grid;grid-template-columns:180px repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.cmp>div{padding:9px 12px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
.cmp>div:nth-child(4n){border-right:0}
.cmp .k{background:var(--box);font-weight:600;font-size:12px;color:var(--ink2)}
.cmp .h{background:var(--ink);color:#fff;font-weight:600}
.daydots{display:flex;gap:3px}
.daydots span{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:10px;border:1px solid var(--fill2)}
.daydots span.a{background:var(--fill)}
.daydots span.l{background:repeating-linear-gradient(135deg,var(--fill2) 0 3px,transparent 3px 6px)}
.daydots span.today{outline:2px solid var(--ink)}

/* ---------- W-08 ---------- */
.ag{border-collapse:separate;border-spacing:2px;font-size:11px}
.ag th{font-weight:600;color:var(--muted);padding:2px;text-align:center}
.ag th.nm{text-align:left;padding-right:10px;color:var(--ink);font-size:12px;white-space:nowrap}
.ag td{width:36px;height:24px;border-radius:3px;text-align:center;font-weight:700;font-size:10.5px;position:relative}
.ag td.A{background:var(--fill)}
.ag td.L{background:repeating-linear-gradient(135deg,#8f8a7e 0 2px,#fff 2px 5px);color:#000}
.ag td.L span{background:#fff;padding:0 2px;border-radius:2px}
.ag td.U{background:#fff;border:1px dashed var(--fill2)}
.ag td .st{position:absolute;top:-3px;right:-2px;font-size:11px;color:var(--accent)}
.ag th.wk{border-left:2px solid var(--ink2)}
.ag td.wk{box-shadow:-3px 0 0 -1px var(--ink2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;align-items:center}
.legend i:not(.pin){display:inline-block;width:22px;height:14px;border-radius:3px;vertical-align:middle;margin-right:5px}

/* ---------- mobile bits ---------- */
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.week div{border:1px solid var(--line);border-radius:7px;padding:5px 3px;text-align:center;font-size:10.5px;min-height:64px;display:flex;flex-direction:column;gap:2px;align-items:center}
.week div b{font-size:12px}
.week div.today{border:2px solid var(--ink)}
.week div.sbd{background:var(--accent-bg);border-color:#b8c8f2}
.week div .tag{font-size:9.5px;line-height:1.2;color:var(--ink2)}
.assign{border:1px solid var(--ink2);border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.assign .tm{font-family:var(--mono);font-weight:700;font-size:13px;min-width:44px}
.assign .x{font-size:12.5px;color:var(--ink2)}
.meter{height:12px;background:var(--box);border-radius:6px;position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);border-radius:6px}
.meter .forty{position:absolute;right:0;top:-4px;bottom:-4px;border-left:2px dashed var(--block)}
.notif{display:flex;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line2)}
.notif:last-child{border-bottom:0}
.notif .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none}
.notif .dot.read{background:transparent;border:1.5px solid var(--fill2)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--ink2);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);padding:10px 16px 16px;display:none;z-index:4;max-height:88%;overflow:auto}
.sheet.on{display:block}
.sheet .grab{width:40px;height:4px;background:var(--fill2);border-radius:2px;margin:0 auto 10px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.offline{background:var(--ink);color:#fff;font-size:11.5px;padding:6px 16px;display:none}
.offline.on{display:block}
.avrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2);padding:8px 0}
.avrow:last-child{border-bottom:0}
.avrow .d{width:62px;font-size:13px}
.avrow .d small{display:block;color:var(--muted);font-size:11px}
.wkchips{display:flex;gap:6px;overflow:auto}
.wkchips button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 8px;font-size:11.5px;white-space:nowrap;cursor:pointer;text-align:left}
.wkchips button.on{border:2px solid var(--ink);font-weight:600}
.sday{border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sday.grey{background:var(--box);color:var(--muted)}
.sday .sl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.slot{border:1.5px solid var(--ink2);border-radius:7px;padding:6px 8px;font-size:12px;cursor:pointer;background:var(--sheet);text-align:left}
.slot small{display:block;font-size:10.5px;color:var(--muted)}

function toast(root, msg, kind=''){

}

      +`<p class="hint" style="margin:8px 0 0">Excluded (Leave Record this week): ${leave.map(nm).join(', ')}</p>`;

}});

init(root){
  const days=[]; const start=new Date(2026,10,5);
  for(let d=new Date(start); d<=new Date(2026,11,5); d.setDate(d.getDate()+1)) if(d.getDay()!==0) days.push(new Date(d));
  const fmt=d=>`${['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]}<br>${d.getDate()}`;
  const key=d=>`${d.getMonth()+1}-${d.getDate()}`;
  const leave={'T07':{'11-16':'L'},'T10':{'11-18':'M'},'T03':{'11-20':'L','11-27':'L'},'T08':{'11-20':'L'},'D05':{'11-9':'L','11-10':'L','11-11':'L'},'T02':{'11-26':'E'}};

    'T06':{'11-16':['C']},'T11':{'11-16':['C']},'T04':{'11-17':['C']},'T09':{'11-17':['C'],'12-1':['P']},'T03':{'11-18':['C'],'11-25':['P']},

    'T07':{'11-20':['C']},'T05':{'11-23':['P']}};
  const unav={'T03':['11-26','11-7'],'T04':['11-21','11-28'],'T05':['11-21'],'D06':['11-6','11-7','11-13','11-14'],'T11':['11-28'],'D03':['11-28']};
  const ids=[...Object.keys(DRV),...Object.keys(TECH)];
  let h=`<tr><th class="nm"></th>${days.map((d,i)=>`<th class="${d.getDay()===1&&i?'wk':''}">${fmt(d)}</th>`).join('')}</tr>`;
  ids.forEach((id,r)=>{
    h+=`<tr><th class="nm">${nm(id)}</th>`+days.map((d,i)=>{const k=key(d); let c='A', txt='';
      if(leave[id]?.[k]){c='L';txt=`<span>${leave[id][k]}</span>`;}
      else if(unav[id]?.includes(k)) c='U';
      else if(d>=new Date(2026,10,30) && (r*7+i)%3!==0) c='U';
      else if(d>=new Date(2026,10,23) && (r*5+i)%9===0) c='U';
      const m=marks[id]?.[k]; let st='';
      if(m){
        if(c==='L' && m[0]==='C') st=`<span class="st" style="color:var(--warn)" title="Confirmed pick overridden by a later Leave Record. Leave takes precedence; history kept.">⊘</span>`;
        else if(m[0]==='C') st=`<span class="st" title="Confirmed Standby pick: initial Standby, still callable">★</span>`;
        else if(m[0]==='P') st=`<span class="st" title="Provisional: not guaranteed until confirmed after the deadline">○</span>`;
        else st=`<span class="st" style="color:var(--block)" title="NotConfirmed: ${m[1]}">✕</span>`;
      }
      return `<td class="${c} ${d.getDay()===1&&i?'wk':''}" title="${nm(id)} · ${d.toDateString()}">${txt}${st}</td>`;}).join('')+'</tr>';
    if(id==='D06') h+=`<tr><td colspan="${days.length+1}" style="height:6px"></td></tr>`;
  });
  $('#w8',root).innerHTML=h;
}});

      <tr><td>2 Nov 14:30</td><td>Alex Ng (IT)</td><td>Account change</td><td>T12 Wong</td><td>Deactivated</td><td>Left the company</td></tr>
      </table></div></div>
  </div>`;
  return desk('workload.local/admin/accounts',['Accounts','Audit Log'],'Accounts','Alex Ng · IT Administrator',body);
},
init(root){
  $$('#w13-tab button',root).forEach(b=>b.onclick=()=>{$$('#w13-tab button',root).forEach(x=>x.classList.toggle('on',x===b));
    const acc=b.dataset.t==='acc'; $('#w13-acc',root).style.display=acc?'':'none'; $('#w13-log',root).style.display=acc?'none':''; $('#w13-title',root).textContent=acc?'Accounts':'Audit Log';
    $$('.appbar .tab',root).forEach(t=>t.classList.toggle('on',t.textContent===(acc?'Accounts':'Audit Log')));});
  $$('#w13-role button',root).forEach(b=>b.onclick=()=>{$$('#w13-role button',root).forEach(x=>x.classList.toggle('on',x===b)); $('#w13-tech',root).style.display=b.textContent==='Technician'?'':'none';});
}});

/* =====================================================================
   NAV / RENDER
   ===================================================================== */
const ORDER=['W-01','W-02','W-03','W-04','W-05','W-06','W-07','W-08','W-09','W-10','W-16','W-11','W-12','W-14','W-15','W-13'];
const FLOW=['W-05','W-06','W-11','W-15','W-16','W-09','W-10','W-03'];
const byId=Object.fromEntries(S.map(s=>[s.id,s]));
let mode='one', flow=false;

function nav(cur){
  const groups=['All roles','Manager','Staff','IT Administrator'];
  const list = flow ? `<h2>Demo flow</h2>`+FLOW.map((id,i)=>`<a href="#${id}" data-nav="${id}" class="${id===cur?'on':''}"><span class="id">${i+1}. ${id}</span>${byId[id].name}</a>`).join('')
    : groups.map(g=>`<h2>${g}</h2>`+ORDER.filter(id=>byId[id].group===g).map(id=>`<a href="#${id}" data-nav="${id}" class="${id===cur?'on':''}"><span class="id">${id}</span>${byId[id].name}</a>`).join('')).join('');
  $('#navlist').innerHTML=list+`<h2>Coverage</h2><div class="small muted" style="padding:0 8px">UC-01–05, 07–13, 15–18 · every active use case has a screen (m2/wireframes.md).</div>`;
}
function block(s){
  return `<section class="scr" id="sec-${s.id}">
    <div class="scr-head"><span class="wid">${s.id}</span><h2>${s.name}</h2></div>
    <div class="meta"><span><b>Role</b> ${s.role}</span><span><b>Boundary</b> <span class="mono">${s.cls}</span></span><span><b>Use case</b> ${s.uc}</span><span><b>Requirements</b> ${s.fr}</span></div>
    <p class="purpose">${s.purpose}</p>
    <div class="frame" data-id="${s.id}">${s.render()}</div>
    <div class="notes">${s.notes.map((n,i)=>`<div><i class="pin n">${i+1}</i><span>${n}</span></div>`).join('')}</div>
    ${flow&&mode==='one'?flowNav(s.id):''}
  </section>`;
}
function flowNav(id){const i=FLOW.indexOf(id); if(i<0)return '';
  return `<div class="row" style="margin-top:18px">${i>0?`<button class="btn" data-go="${FLOW[i-1]}">← ${FLOW[i-1]}</button>`:''}<span class="spacer"></span>${i<FLOW.length-1?`<button class="btn dark" data-go="${FLOW[i+1]}">Next: ${FLOW[i+1]} ${byId[FLOW[i+1]].name} →</button>`:''}</div>`;}

document.addEventListener('click',e=>{ const b=e.target.closest('[data-nb]'); if(!b)return; e.preventDefault(); let r=b.parentElement; while(r&&!r.querySelector('.toast')) r=r.parentElement; if(!r){ const ph=b.closest('.phone'); if(ph){ const t=document.createElement('div'); t.className='toast'; ph.appendChild(t); r=ph; } } if(r) toast(r,'Not built in this wireframe. It behaves as described in the notes.'); });
function bindGo(root){ $$('[data-go]',root).forEach(b=>{ if(b._go)return; b._go=1; b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.go);}); }); }
let CUR = (location.hash||'').slice(1);
function go(id){
  if(!byId[id]) return;
  CUR=id; try{ history.replaceState(null,'','#'+id); }catch(e){}
  if(mode==='all'){ nav(null); const el=$('#sec-'+id); if(el) el.scrollIntoView({behavior:'smooth'}); return; }
  render();
}
$('#navlist').addEventListener('click',e=>{const a=e.target.closest('[data-nav]'); if(!a)return; e.preventDefault(); go(a.dataset.nav);});

const ro = new ResizeObserver(fit);
function fit(){ $$('.scaler').forEach(sc=>{const d=$('.desk',sc); const k=Math.min(1, sc.clientWidth/1366); d.style.transform=`scale(${k})`; sc.style.height=(d.offsetHeight*k)+'px';}); }

function render(){
  const cur = byId[CUR] ? CUR : 'W-01';
  const ids = mode==='all' ? ORDER : [cur];
  $('#main').innerHTML = ids.map(id=>block(byId[id])).join('');
  ids.forEach(id=>{ const root=$(`.frame[data-id="${id}"]`); byId[id].init?.(root); bindGo(root); });
  bindGo($('#main'));
  nav(mode==='all'?null:ids[0]);
  ro.disconnect(); $$('.desk').forEach(d=>ro.observe(d)); $$('.scaler').forEach(s=>ro.observe(s)); fit();
  if(mode==='one') window.scrollTo(0,0);
}
$('#m-one').onclick=()=>{mode='one';$('#m-one').classList.add('on');$('#m-all').classList.remove('on');render();};
$('#m-all').onclick=()=>{mode='all';$('#m-all').classList.add('on');$('#m-one').classList.remove('on');render();};
$('#m-pins').onclick=()=>{document.body.classList.toggle('pins');$('#m-pins').classList.toggle('on');$('#m-pins').textContent=document.body.classList.contains('pins')?'Pins on':'Pins off';};
$('#m-flow').onclick=()=>{flow=!flow;$('#m-flow').classList.toggle('on',flow); if(flow&&mode==='one'&&!FLOW.includes(CUR)) go(FLOW[0]); else render();};
render();
</script>
</body>
